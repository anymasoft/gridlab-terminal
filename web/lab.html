<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GRIDLAB · Optimization Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f6f7f4; --panel:#fff; --line:#e3e6e0; --ink:#14181a; --mut:#5b635e; --mut2:#939a93;
         --green:#1F8A5B; --red:#a93529; --blue:#3B82CE; --gold:#C98A1A; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:13px;}
  .mono{font-family:'Space Mono',monospace;}
  a{color:var(--blue);text-decoration:none;}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);}
  header .logo{font-weight:700;letter-spacing:.04em;}
  header .tag{font-size:11px;color:var(--mut2);letter-spacing:.12em;}
  .wrap{display:grid;grid-template-columns:300px 1fr;gap:0;min-height:calc(100vh - 49px);}
  .side{background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow-y:auto;}
  .main{padding:16px 18px;overflow-y:auto;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;}
  .h{font-size:10px;letter-spacing:.1em;color:var(--mut2);font-weight:600;text-transform:uppercase;margin-bottom:8px;}
  label{display:block;font-size:11px;color:var(--mut);margin:8px 0 3px;}
  input,select{width:100%;font-family:'Space Mono',monospace;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;outline:none;}
  button{font-family:'Space Grotesk';font-weight:600;border:0;border-radius:8px;padding:9px;cursor:pointer;font-size:12.5px;}
  .btn{background:var(--green);color:#fff;width:100%;margin-top:8px;}
  .btn.alt{background:#fff;color:var(--mut);border:1px solid var(--line);}
  .tabs{display:flex;gap:4px;margin-bottom:12px;}
  .tab{padding:7px 14px;border-radius:7px 7px 0 0;background:transparent;color:var(--mut2);border-bottom:2px solid transparent;}
  .tab.on{background:#fff;color:var(--ink);border-bottom:2px solid var(--green);}
  table{width:100%;border-collapse:collapse;font-size:11.5px;}
  th,td{text-align:right;padding:5px 8px;border-bottom:1px solid #f1f2ef;}
  th{color:var(--mut2);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.05em;}
  th:first-child,td:first-child{text-align:left;}
  .pos{color:var(--green);} .neg{color:var(--red);}
  .pill{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;}
  .muted{color:var(--mut2);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kv{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;}
  .kv span:first-child{color:var(--mut);}
  .row{display:flex;gap:8px;align-items:center;}
  .note{font-size:11px;color:var(--mut2);line-height:1.5;}
</style>
</head>
<body>
<header>
  <span class="logo">GRIDLAB</span>
  <span class="tag">OPTIMIZATION LAB</span>
  <span id="dataInfo" class="mono muted" style="font-size:11px;"></span>
  <span style="margin-left:auto;"><a href="/">← Терминал</a></span>
</header>
<div class="wrap">
  <div class="side" id="side"></div>
  <div class="main" id="main"></div>
</div>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="/lab.js"></script>
</body>
</html>
